name: terraform-quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        directory:
          - .
          - modules/autoscaling
          - examples/minimal
          - examples/complete
          - examples/provisioned-autoscaled
          - examples/global-table
          - examples/multiple-tables
    uses: hatan4ik/terraform-pipelines/.github/workflows/terraform-quality.yml@8fc2a04c7931dd449097bb92b15b085278e3f67a # v0.1.1
    with:
      working_directory: ${{ matrix.directory }}
      check_docs: true

  # The two aws_dynamodb_table bodies in table.tf exist only because Terraform
  # cannot make ignore_changes conditional, and must stay identical apart from
  # count and ignore_changes. make check and pre-commit run this too; this job
  # enforces it for pull requests made without pre-commit installed.
  variants:
    name: table variants identical
    runs-on: ubuntu-24.04
    steps:
      - name: Check out revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compare aws_dynamodb_table.this and .autoscaled
        run: scripts/check-resource-variants.sh table.tf aws_dynamodb_table this autoscaled
